  - {title: "数据仓库分层规范", chapters: [分层总览, ODS 贴源层, DIM 维度层, DWD 明细层, DWS 汇总层, ADS 报表层, 跨层引用规则, 分层选表原则, 数据保留策略, 常见反模式]}
