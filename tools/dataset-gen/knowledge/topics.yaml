  - {title: "数据质量规范", chapters: [质量维度, 主键唯一, 非空检查, 分层对账, 波动监控, 时效监控, 告警分级, 事故处理流程, 质量报告, 责任划分]}
  - {title: "数据权限与安全规范", chapters: [数据分级, 敏感字段, 权限申请, 个人副本表, 导出管理, 脱敏规则, 审计, 账号管理, 违规处理, 常见问题]}
  - {title: "数据开发上线流程", chapters: [需求评审, 模型设计, 开发与自测, 代码评审, 数据验证, 调度配置, 上线发布, 回滚方案, 上线公告, 上线后观察]}
  - {title: "临时表与个人副本管理办法", chapters: [适用对象, 命名要求, 创建审批, 使用范围, 生命周期, 定期清理, 备份表管理, 分表管理, 测试表管理, 违规处理]}
